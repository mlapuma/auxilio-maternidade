services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salario_maternidade
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d salario_maternidade"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
