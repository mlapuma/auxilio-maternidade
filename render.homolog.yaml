services:
  - type: web
    name: auxilio-maternidade-hml-mlapuma-api
    runtime: docker
    repo: https://github.com/mlapuma/auxilio-maternidade
    branch: feature/whatsapp-lead-integration-v102
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: virginia
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60.0
      - key: CORS_ALLOWED_ORIGINS
        value: https://auxilio-maternidade-hml-mlapuma.onrender.com
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USER
        value: advogado-hml
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: WHATSAPP_PUBLIC_NUMBER
        value: "15551571513"
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_SENDING_ENABLED
        value: "true"
      - key: WHATSAPP_OUTBOX_SCHEDULER_ENABLED
        value: "true"
      - key: WHATSAPP_OUTBOX_TARGET_PHONE
        value: "5511979979347"
      - key: WHATSAPP_OUTBOX_POLL_INTERVAL_MS
        value: "1000"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"

  - type: web
    name: auxilio-maternidade-hml-mlapuma
    runtime: static
    repo: https://github.com/mlapuma/auxilio-maternidade
    branch: feature/whatsapp-lead-integration-v102
    autoDeployTrigger: off
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_BASE_URL
        value: https://auxilio-maternidade-hml-mlapuma-api.onrender.com
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-store
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
