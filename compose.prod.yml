services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: salario_maternidade
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d salario_maternidade"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/salario_maternidade
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:?Defina ADMIN_USER}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Defina ADMIN_PASSWORD_HASH}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on: [backend]
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
