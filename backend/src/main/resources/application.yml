spring:
  application:
    name: salario-maternidade-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salario_maternidade}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
